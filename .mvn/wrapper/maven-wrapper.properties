# region Reproducible Maven launcher configuration
# wrapperVersion identifies the wrapper scripts, not the Maven version itself.
# only-script bootstraps Maven without a checked-in maven-wrapper.jar.
# distributionUrl pins Maven 3.9.16; both launchers download and cache this
# distribution if it is unavailable locally, then forward build arguments.
# An optional distributionSha256Sum is supported by the scripts but is not set.
# endregion
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
