# region Application identity
# Spring uses this name to identify the application in logs and integrations.
# These are the default settings; an active profile can override individual keys.
# endregion
spring.application.name=taskflow

# region Development database connection
# Connect to the local PostgreSQL taskflow database using the postgres account.
# DB_PASSWORD is resolved from the environment/configuration, not stored here.
# The database must exist and be reachable before JPA can initialize.
# endregion
spring.datasource.url=jdbc:postgresql://localhost:5432/taskflow
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# region Schema management and SQL diagnostics
# Hibernate updates the schema from the entity mappings at startup. This is not
# a versioned migration history. Flyway is on the classpath, but this project
# currently has no migration scripts. SQL logging shows formatted statements;
# it does not change query behavior or provide an ordering guarantee.
# endregion
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# region Token signing configuration
# JWT_SECRET must be Base64 text encoding a sufficiently strong HMAC key.
# JwtService decodes it at startup and uses it for both signing and verification.
# Changing the key makes previously issued tokens fail signature verification.
# endregion
jwt.secret=${JWT_SECRET}
