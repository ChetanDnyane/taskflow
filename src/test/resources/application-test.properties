# region Isolated integration-test database
# ActiveProfiles("test") loads these overrides instead of using PostgreSQL.
# H2 stores data in memory. PostgreSQL mode approximates dialect behavior; it
# does not make H2 equivalent to the production database. DB_CLOSE_DELAY=-1
# retains the database after the last connection closes within the JVM.
# endregion
spring.datasource.url=jdbc:h2:mem:taskflow-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# region Rebuild test tables from entity mappings
# Hibernate creates tables when the persistence context starts and drops them
# when it closes. WorkflowTest also deletes rows before each test case.
# Flyway is disabled, so this suite tests mappings rather than migration scripts.
# endregion
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
# region Deterministic test signing key
# Public test-only signing key; never use this in a deployed application.
# The same fixture in token tests allows intentionally valid/expired signatures
# to be constructed without reading JWT_SECRET from the developer environment.
# endregion
jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
